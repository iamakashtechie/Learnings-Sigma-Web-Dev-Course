    <style>
      /* ── Reset & base ── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg:       #0f0f1a;
        --surface:  #1a1a2e;
        --card:     #16213e;
        --border:   #2a2a4a;
        --accent:   #7c3aed;
        --accent2:  #06b6d4;
        --text:     #e2e8f0;
        --muted:    #94a3b8;
        --badge-bg: #1e3a5f;
        --radius:   12px;
        --shadow:   0 4px 20px rgba(0,0,0,.4);
      }

      html { scroll-behavior: smooth; }

      body {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }

      /* ── Header ── */
      header {
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        border-bottom: 1px solid var(--border);
        padding: 2.5rem 1.5rem 2rem;
        text-align: center;
      }

      header h1 {
        font-size: clamp(1.6rem, 4vw, 2.6rem);
        font-weight: 800;
        background: linear-gradient(90deg, #a78bfa, #38bdf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: .5rem;
      }

      header p {
        color: var(--muted);
        font-size: .95rem;
        margin-bottom: 1.5rem;
      }

      /* ── Search bar ── */
      .search-wrap {
        display: flex;
        justify-content: center;
        gap: .75rem;
        flex-wrap: wrap;
      }

      #search {
        width: min(420px, 100%);
        padding: .65rem 1rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font-size: 1rem;
        outline: none;
        transition: border-color .2s;
      }

      #search:focus { border-color: var(--accent); }

      #search::placeholder { color: var(--muted); }

      /* ── Stats bar ── */
      .stats {
        display: flex;
        justify-content: center;
        gap: 2rem;
        flex-wrap: wrap;
        padding: 1rem 1.5rem;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        font-size: .85rem;
        color: var(--muted);
      }

      .stats span strong { color: var(--text); }

      /* ── Filter tabs ── */
      .filter-bar {
        display: flex;
        gap: .5rem;
        flex-wrap: wrap;
        padding: 1rem 1.5rem;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        justify-content: center;
      }

      .filter-btn {
        padding: .35rem .9rem;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--muted);
        font-size: .82rem;
        cursor: pointer;
        transition: all .2s;
        white-space: nowrap;
      }

      .filter-btn:hover,
      .filter-btn.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      /* ── Main content ── */
      main {
        max-width: 1280px;
        margin: 0 auto;
        padding: 2rem 1.5rem;
      }

      /* ── Category section ── */
      .category {
        margin-bottom: 2.5rem;
      }

      .category-header {
        display: flex;
        align-items: center;
        gap: .75rem;
        margin-bottom: 1rem;
      }

      .category-icon {
        font-size: 1.5rem;
      }

      .category-title {
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--text);
      }

      .category-count {
        margin-left: auto;
        background: var(--badge-bg);
        color: var(--muted);
        font-size: .75rem;
        padding: .2rem .6rem;
        border-radius: 999px;
      }

      /* ── Grid ── */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 1rem;
      }

      /* ── Card ── */
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.1rem 1.25rem;
        display: flex;
        flex-direction: column;
        gap: .5rem;
        transition: transform .2s, border-color .2s, box-shadow .2s;
        position: relative;
        overflow: hidden;
      }

      .card::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: var(--radius);
        background: linear-gradient(135deg, var(--accent) 0%, transparent 60%);
        opacity: 0;
        transition: opacity .3s;
        pointer-events: none;
      }

      .card:hover {
        transform: translateY(-3px);
        border-color: var(--accent);
        box-shadow: var(--shadow);
      }

      .card:hover::before { opacity: .06; }

      .card-num {
        font-size: .72rem;
        color: var(--accent2);
        font-weight: 600;
        letter-spacing: .04em;
        text-transform: uppercase;
      }

      .card-title {
        font-size: .95rem;
        font-weight: 600;
        color: var(--text);
        line-height: 1.35;
      }

      .card-actions {
        margin-top: auto;
        padding-top: .4rem;
        display: flex;
        gap: .5rem;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: .35rem;
        padding: .3rem .75rem;
        border-radius: 6px;
        font-size: .78rem;
        font-weight: 600;
        text-decoration: none;
        transition: filter .2s, opacity .2s;
        border: none;
        cursor: pointer;
      }

      .btn:hover { filter: brightness(1.15); }

      .btn-primary {
        background: linear-gradient(90deg, var(--accent), #9333ea);
        color: #fff;
      }

      .btn-secondary {
        background: var(--badge-bg);
        color: var(--muted);
        border: 1px solid var(--border);
      }

      /* ── No results ── */
      #no-results {
        display: none;
        text-align: center;
        color: var(--muted);
        padding: 3rem 1rem;
        font-size: 1.1rem;
      }

      /* ── Footer ── */
      footer {
        text-align: center;
        color: var(--muted);
        font-size: .8rem;
        padding: 2rem 1rem;
        border-top: 1px solid var(--border);
      }

      footer a { color: var(--accent2); text-decoration: none; }
      footer a:hover { text-decoration: underline; }

      /* ── Hidden ── */
      .hidden { display: none !important; }
    </style>
  </head>

            const show = catMatch && titleMatch;
            card.classList.toggle("hidden", !show);
            if (show) { sectionHasCard = true; anyVisible = true; }
          });

          section.classList.toggle("hidden", !sectionHasCard);
        });

        noResults.style.display = anyVisible ? "none" : "block";
      }
    </script>
  </body>
</html>
