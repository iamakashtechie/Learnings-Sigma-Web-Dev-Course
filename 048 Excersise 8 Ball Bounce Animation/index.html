<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ball Bounce Animation</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            background-color: rgb(0, 0, 0);
        }

        .box {
            height: 70px;
            width: 70px;
            background-color: rgb(183, 182, 182);
            border-radius: 70px;
            position: absolute;
            bottom: 0;
            left: 0;
            animation: animateX 3s linear infinite,
                animateY 0.5s ease-out infinite alternate;
                /* animateNY 0.5s ease-out infinite; */
        }

        .container {
            position: relative;
            height: 80vh;
            width: 100%;
            background-color: rgb(59, 59, 59);
        }

        @keyframes animateX {
            from {
                left: 0;
            }

            to {
                left: 100%;
            }
        }

        @keyframes animateY {
            from {
                bottom: 0;
            }

            to {
                bottom: 80%;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="box">
        </div>
    </div>
    <!-- 
   
     -->
</body>

</html>
