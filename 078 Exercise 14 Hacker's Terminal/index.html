<body>
    <!-- Create a hacking simulator which has green background and it shows these messages with random delay of 1 to 7 seconds 
    
    Initializing Hacking...
    Reading your Files...
    Password files Detected...
    Sending all passwords and personal files to server...
    Cleaning up...
    
    The three dots must blink so that it looks like a real terminal
    -->
    <div class="container">
        <header>
            <div class="text">>_ H A C K E R</div>
        </header>
        <div class="terminal">
            
        </div>
    </div>
    <script>

        let text = ["Initialized Hacking now reading your data",
            "Reading your Files",
            "Password files Detected",
            "Sending all passwords and personal files to server",
            "Cleaning up"]
            
            const randomDelay = () => {
                return new Promise((resolve, reject) => {
                    timeout = 1 + 6 * Math.random();
                    setTimeout(() => {
                        resolve()
                    }, timeout * 1000);
                })
            }

            const addItem = async (item) => {
                await randomDelay();
                let div = document.createElement("div");
                div.innerHTML = item;
                document.querySelector(".terminal").append(div)
                // console.log("added successfully");
            }
            
        
        async function main() {

            let t = setInterval(() => {
                let last = document.querySelector(".terminal").getElementsByTagName("div")
                last = last[last.length - 1]    // last div

                if(last.innerHTML.endsWith("...")) {
                    last.innerHTML = last.innerHTML.slice(0, last.innerHTML.length - 3)
                }
                else{
                    last.innerHTML = last.innerHTML + "."
                }

            }, 300);

            for (const item of text) {
                await addItem(item)
                console.log(item);
            }

            await randomDelay()
            clearInterval(t)
            
        }
        main()
        
    </script>
