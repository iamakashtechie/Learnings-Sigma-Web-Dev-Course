<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: #eaeff1;
        }
        .card {
            height: 434px;
            width: 293px;
            background-color: white;
            display: flex;
            flex-direction: column;
            border: 2px solid rgb(191, 191, 191);
            overflow: hidden;
            border-radius: 10px;
        }

        .img {
            height: 205px;
            width: 277px;
            display: flex;
            border: 8px solid white;
            overflow: hidden;
            border-radius: 17px;

        }

        .tag-container {
            border: 8px solid rgb(255, 255, 255);
        }

        .tags {
            height: 16px;
            width: auto;
            padding: 3px 7px;
            border: 2px solid rgb(225, 225, 225);
            border-radius: 18px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        .info {
            border: 8px solid rgb(255, 255, 255);
            height: 112px;
            font-size: 13px;
        }
        .more {
            text-align: center;
            border: 8px solid white;
        }
        .more p {
            display: inline;
            border-radius: 15px;
            background-color: #e0efff;
            color: #57a6ff;
            padding: 8px 12px;
        }
    </style>
</head>

<body>
    <!-- card.png is a file which contains a card Image. Write html and css code to design this card. Use #html -->
    <div class="card">
        <div class="img">
            <img src="Tarsar Lake.jpg" alt="tarsar-lake">
        </div>

        <!-- Must use Span as it is inline for below -->

        <div class="tag-container">
            <div class="tags">
                <p>Nature</p>
            </div>
            <div class="tags">
                <p>Lake</p>
            </div>
        </div>
        <div class="info">
            <h1>Tarsar Lake</h1>
            <p>Tarsar Lake, in Kashmir, India, is a high-altitude alpine lake known for its stunning beauty and serene environment.</p>
        </div>
        <div class="more">
            <p>Read More</p>
        </div>
    </div>
</body>

</html>
