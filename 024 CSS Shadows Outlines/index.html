<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shadows And Outlines</title>
    <style>
        .box {
            border: 2px solid black;
            padding: 34px;
            /* box-shadow: h-offset v-offset blur spread color inset;

            h-offset & v-offset: Determines the shadow's horizontal and vertical position
            blur: The larger the value the blurrier the shadow
            spread: Expands or shrinks the shadow size
            color: Defines the shadow color
            inset: Makes the shadow inner */

            box-shadow: 5px 5px 15px #888888;
        }

        .text-element {
            /* text-shadow: h-offset v-offset blur color;*/
            text-shadow: 10px 5px 3px #e695f7
        }

        /* ⭐Differences b/w Outlines and Borders:
            1. Position: Outlines don't take up space; they're drawn around the element, outside of any border
            2. Offset: Using the "outline-offset" property, you can set the space b/w an outline and the edge or border of an element
            3. Width: Borders can have varying widths on different sides, outlines have uniform width
            4. Rounded corners: Borders can have rounded corners using "border-radius", while outlines generally cannot */

        /* Note: You can't make outline curvy directly, it follows Border (border-radius : 10px;) */
    </style>
</head>

<body>
    <div class="box">
        I am a box
    </div>
    <p class="text-element">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Architecto, atque. Modi voluptatibus necessitatibus architecto quidem sit maiores, ad nesciunt et odit esse. Possimus, ipsam et molestiae eius quae nisi quisquam maiores fugiat aut fuga!
    </p>

</body>

</html>
